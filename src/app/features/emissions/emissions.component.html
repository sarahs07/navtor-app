<main class="feature-page">
  <h1>Emissions</h1>

  @if (loading$ | async) {
    <p class="feature-lead">Loading…</p>
  }

  @if (error$ | async; as err) {
    <p class="feature-lead" role="alert">{{ err }}</p>
  }

  @if (emissions$ | async; as records) {
    <mat-form-field appearance="outline" class="emission-type-field">
      <mat-label>Emission type</mat-label>
      <mat-select
        [value]="selectedMetric()"
        (selectionChange)="onMetricSelected($event.value)"
      >
        @for (opt of metricOptionsFor(records); track opt.key) {
          <mat-option [value]="opt.key">{{ opt.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  }
</main>
