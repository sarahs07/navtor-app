<main class="feature-page">
  <h1>Emissions</h1>
  <p class="feature-lead">
    Line chart uses <strong>CO₂</strong> and <strong>NOx</strong> from each interval. Choose a
    vessel to update the series.
  </p>

  @if (loading$ | async) {
    <p class="feature-lead">Loading…</p>
  }

  @if (error$ | async; as err) {
    <p class="feature-lead" role="alert">{{ err }}</p>
  }

  @if (records(); as list) {
    @if (list.length) {
      <mat-form-field appearance="outline" class="vessel-field">
        <mat-label>Vessel</mat-label>
        <mat-select
          [value]="selectedVesselId()"
          (selectionChange)="onVesselSelected($event.value)"
        >
          @for (v of list; track v.id) {
            <mat-option [value]="v.id">Vessel {{ v.id }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div class="chart-wrap">
        <highcharts-chart
          [options]="chartOptions()"
          style="width: 100%; height: 420px; display: block;"
        />
      </div>
    }
  }
</main>
